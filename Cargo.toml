[package]
name = "netmail-sieve-assets"
version = "0.3.1"
edition = "2021"
authors = ["NetMail Developers <dev@netmail.local>"]
license = "MIT OR Apache-2.0"
description = "High-performance C-ABI shared library wrapping Sieve (RFC 5228/5230) for NetMail and .NET"
readme = "README.md"
repository = "https://github.com/devMls/netmail-sieve-assets"

[lib]
name = "netmail_sieve"
crate-type = ["cdylib", "rlib"]

[dependencies]
mailrs-sieve-core = "=0.3.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-normalization = "0.1"

[profile.release]
opt-level = "z"        # Optimize for size
lto = true             # Enable link-time optimization
codegen-units = 1      # Maximize size optimizations across crates
panic = "unwind"       # FFI catch_unwind must also work in release builds
strip = true           # Strip debug symbols and line tables

[patch.crates-io]
# Upstream parser/evaluator, with documented source-span and lexer fixes.
mailrs-sieve-core = { path = "vendor/mailrs-sieve-core-0.3.0" }
