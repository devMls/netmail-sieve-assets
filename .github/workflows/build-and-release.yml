name: Build Sieve Native Binaries

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-matrix:
    name: Build for ${{ matrix.os }} (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            artifact_name: netmail_sieve.dll
            rid_path: runtimes/win-x64/native/netmail_sieve.dll
            output_binary: target/x86_64-pc-windows-msvc/release/netmail_sieve.dll

          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact_name: libnetmail_sieve.so
            rid_path: runtimes/linux-x64/native/libnetmail_sieve.so
            output_binary: target/x86_64-unknown-linux-gnu/release/libnetmail_sieve.so

          - os: macos-latest
            target: aarch64-apple-darwin
            artifact_name: libnetmail_sieve-arm64.dylib
            rid_path: runtimes/osx-arm64/native/libnetmail_sieve.dylib
            output_binary: target/aarch64-apple-darwin/release/libnetmail_sieve.dylib

          - os: macos-latest
            target: x86_64-apple-darwin
            artifact_name: libnetmail_sieve-x64.dylib
            rid_path: runtimes/osx-x64/native/libnetmail_sieve.dylib
            output_binary: target/x86_64-apple-darwin/release/libnetmail_sieve.dylib

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release dynamic library
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare staged RID layout
        shell: bash
        run: |
          mkdir -p $(dirname "${{ matrix.rid_path }}")
          cp "${{ matrix.output_binary }}" "${{ matrix.rid_path }}"

      - name: Upload platform artifact
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: ${{ matrix.rid_path }}

  package-bundle:
    name: Package Combined .NET Runtimes Bundle
    needs: build-matrix
    runs-on: ubuntu-latest
    steps:
      - name: Download all built binaries
        uses: actions/download-artifact@v4
        with:
          path: staged_artifacts

      - name: Assemble standard .NET runtimes/ folder
        run: |
          mkdir -p runtimes/win-x64/native
          mkdir -p runtimes/linux-x64/native
          mkdir -p runtimes/osx-arm64/native
          mkdir -p runtimes/osx-x64/native

          find staged_artifacts -type f -name "netmail_sieve.dll" -exec cp {} runtimes/win-x64/native/ \;
          find staged_artifacts -type f -name "libnetmail_sieve.so" -exec cp {} runtimes/linux-x64/native/ \;
          find staged_artifacts -type f -name "libnetmail_sieve.dylib" -exec cp {} runtimes/osx-arm64/native/ \;
          find staged_artifacts -type f -name "libnetmail_sieve.dylib" -exec cp {} runtimes/osx-x64/native/ \;

          echo "Directory structure created:"
          find runtimes -type f

          zip -r netmail_sieve_runtimes.zip runtimes

      - name: Upload final runtimes.zip artifact
        uses: actions/upload-artifact@v4
        with:
          name: netmail_sieve_runtimes
          path: netmail_sieve_runtimes.zip

      - name: Publish to GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: netmail_sieve_runtimes.zip
