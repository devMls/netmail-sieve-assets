name: Build and verify Sieve native assets

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  NETMAIL_SIEVE_SOURCE_REVISION: ${{ github.sha }}
  CARGO_INCREMENTAL: '0'

jobs:
  build-matrix:
    name: Test and build ${{ matrix.rid }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            target: x86_64-pc-windows-msvc
            rid: win-x64
            arch: x86_64
            library: netmail_sieve.dll
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rid: linux-x64
            arch: x86_64
            library: libnetmail_sieve.so
          - os: macos-15
            target: aarch64-apple-darwin
            rid: osx-arm64
            arch: aarch64
            library: libnetmail_sieve.dylib
          - os: macos-15-intel
            target: x86_64-apple-darwin
            rid: osx-x64
            arch: x86_64
            library: libnetmail_sieve.dylib
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.99.1
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check format, lint and adapter regressions
        run: |
          cargo fmt --check
          cargo clippy --locked --all-targets -- -D warnings
          cargo test --locked
          python -m unittest discover -s tests -p "test_*.py"
      - name: Run reference unit tests and frozen corpus
        run: cargo test --locked --manifest-path vendor/mailrs-sieve-core-0.3.0/Cargo.toml --tests
      - name: Build release with functioning panic containment
        run: cargo build --locked --release --target ${{ matrix.target }}
      - name: Stage and exercise the actual native ABI
        shell: bash
        run: |
          destination="stage/runtimes/${{ matrix.rid }}/native"
          mkdir -p "$destination"
          cp "target/${{ matrix.target }}/release/${{ matrix.library }}" "$destination/"
          python tools/smoke_abi.py "$destination/${{ matrix.library }}" --expected-arch "${{ matrix.arch }}" --output "$destination/runtime-info.json"
      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.rid }}
          path: stage/
          if-no-files-found: error

  package-bundle:
    needs: build-matrix
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: staged_artifacts
          merge-multiple: true
      - name: Verify architecture, version and revision before packaging
        run: python tools/package_assets.py staged_artifacts netmail_sieve_runtimes.zip
      - uses: actions/upload-artifact@v4
        with:
          name: netmail_sieve_runtimes
          path: netmail_sieve_runtimes.zip
          if-no-files-found: error
      - name: Publish verified bundle
        if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'Pre-compiled assets (latest)' }}
          files: netmail_sieve_runtimes.zip
          fail_on_unmatched_files: true
          draft: false
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/v') }}
